<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Giriş — Patent Paneli</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        background: #020617;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 22px;
      }
      .subtitle {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 28px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #9ca3af;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #0f172a;
        color: #e5e7eb;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 16px;
      }
      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.4);
      }
      .btn {
        width: 100%;
        padding: 10px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        color: white;
        margin-top: 4px;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .error {
        background: rgba(248, 113, 113, 0.1);
        color: #fca5a5;
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Patent Paneli</h1>
      <p class="subtitle">Devam etmek için giriş yapın.</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus />

        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" autocomplete="current-password" />

        <button class="btn" type="submit">Giriş Yap</button>
      </form>
    </div>
  </body>
</html>
